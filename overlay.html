<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Wedding — Invitation</title>
    <meta name="description" content="E-invitation" />

    <!-- Add your custom TTF font -->
    <style>
        @font-face {
            font-family: 'WeddingFont';
            src: url('WeddingFont.ttf') format('truetype');
            /* Put your TTF file in same folder or adjust path */
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #fbf9f6;
            --card: #ffffff;
            --accent: #b98f6b;
            --muted: #7a6d62;
            --shadow: 0 10px 30px rgba(36, 36, 36, 0.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'WeddingFont', 'Inter', system-ui, Arial;
            background: linear-gradient(180deg, var(--bg), #fff);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .invite-wrap {
            width: 100%;
            max-width: 820px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 420px;
            min-height: 520px;
        }

        .hero {
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: flex-start;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255, 250, 247, 0.9), rgba(255, 255, 255, 0.6));
        }

        .logo {
            font-size: 18px;
            color: var(--muted);
            letter-spacing: 2px;
        }

        h1 {
            font-family: 'WeddingFont', serif;
            font-size: 44px;
            margin: 0;
            color: #222;
        }

        .names {
            font-size: 22px;
            color: var(--muted);
        }

        .details {
            margin-top: 12px;
            font-size: 16px;
            color: var(--muted);
            line-height: 1.5;
        }

        .rsvp-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 12px;
            border: 0;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 6px 18px rgba(185, 143, 107, 0.24);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #eee;
            color: var(--muted);
        }

        .quote {
            font-style: italic;
            color: #a08b7b;
        }

        .panel {
            background-image: linear-gradient(180deg, rgba(250, 248, 246, 0.6), rgba(255, 255, 255, 0.6));
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .photo {
            width: 100%;
            height: 300px;
            border-radius: 14px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .info .when {
            font-weight: 600;
        }

        .location {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            z-index: 50;
        }

        .modal-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            min-width: 320px;
            box-shadow: var(--shadow);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        input,
        textarea,
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            font-size: 15px;
        }

        @media (max-width: 880px) {
            .invite-wrap {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .photo {
                height: 260px;
            }

            .hero {
                padding: 28px;
            }
        }
    </style>
</head>

<body>
    <!-- Clickable map with "Click me" badge pointing to bottom-left -->
<a class="map-link" href="https://maps.google.com/your-place" target="_blank" rel="noopener" aria-label="Open location in Google Maps">
  <img class="map-screenshot" src="map-screenshot.jpg" alt="Map to the venue — click to open in Google Maps">
  <div class="click-badge" role="button" aria-hidden="true">
    <span>Click me</span>
    <!-- Arrow SVG rotated so it points bottom-left -->
    <svg class="badge-arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <path d="M4 12h12M12 4v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</a>

<style>
  /* Container / link */
  .map-link {
    display: inline-block;           /* shrink to image size */
    position: relative;
    text-decoration: none;
    border-radius: 8px;
    overflow: visible;
  }

  /* Map image — responsive */
  .map-screenshot {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  }

  /* Floating badge */
  .click-badge {
    position: absolute;
    top: 12px;                      /* tweak these to place the badge */
    right: 12px;                    /* e.g. top-right of the image */
    background: rgba(255,255,255,0.98);
    color: #111;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    cursor: pointer;
    user-select: none;
    transform-origin: center;
    transition: transform 150ms ease, box-shadow 150ms ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    font-size: 14px;
  }

  /* Slight hover effect */
  .map-link:hover .click-badge,
  .map-link:focus .click-badge {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(0,0,0,0.18);
  }

  /* Arrow styling — rotate to point bottom-left */
  .badge-arrow {
    display: inline-block;
    width: 18px;
    height: 18px;
    transform: rotate(-135deg); /* points to bottom-left */
    color: #111;                /* arrow color matches text */
    opacity: 0.95;
  }

  /* Small screens: move badge so arrow still points toward map area */
  @media (max-width: 480px) {
    .click-badge {
      top: 8px;
      right: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }
  }
</style>
</body>

</html>
